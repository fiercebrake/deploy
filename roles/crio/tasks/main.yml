---
- name: 'install cri-o'
  ansible.builtin.apt:
    lock_timeout: 90
    name: "{{ item }}"
    state: latest
  with_items:
    - 'cri-tools'
    - 'cri-o'

- name: 'start cri-o service'
  ansible.builtin.service:
    name: 'crio'
    state: started
    enabled: yes

